name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 25.8.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Linux UI bootstrap packages
        uses: actions/cache@v4
        with:
          path: .tools/packages
          key: linux-ui-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap-linux-ui.sh') }}

      - name: Restore wasm-bindgen CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.127-${{ runner.os }}-${{ runner.arch }}

      - name: Install Linux UI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap imagemagick jq libarchive-tools
          sudo ln -sf /usr/bin/bash /opt/bash
          npm ci
          npx playwright install --with-deps chromium

      - name: Install wasm-bindgen CLI
        run: command -v wasm-bindgen || cargo install --locked wasm-bindgen-cli --version 0.2.127

      - name: Verify
        run: |
          mkdir -p .tools/runtime/verification-evidence
          set -o pipefail
          cargo xtask verify 2>&1 | tee .tools/runtime/verification-evidence/cargo-xtask-verify.log

      - name: Upload verification evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: .tools/runtime/verification-evidence
          if-no-files-found: warn
